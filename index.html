<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lammio</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma;
}

body{
background:#eef2ff;
}

header{
background:#4f46e5;
color:#fff;
padding:18px;
text-align:center;
font-size:28px;
font-weight:bold;
box-shadow:0 3px 8px rgba(0,0,0,.2);
}

#content{
padding:15px;
padding-bottom:90px;
}

.post{
background:#fff;
border-radius:15px;
padding:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.post h3{
color:#4f46e5;
margin-bottom:8px;
}

.post h4{
margin-bottom:10px;
}

.post p{
line-height:1.7;
margin-bottom:10px;
}

.actions{
display:flex;
justify-content:space-around;
margin-top:15px;
}

.actions button{
background:#eef2ff;
border:none;
padding:10px;
border-radius:10px;
cursor:pointer;
font-size:16px;
}

input,
textarea{
width:100%;
padding:12px;
margin:10px 0;
border:1px solid #ccc;
border-radius:10px;
font-size:16px;
}

.mainButton{
width:100%;
padding:14px;
background:#4f46e5;
color:white;
border:none;
border-radius:12px;
font-size:18px;
cursor:pointer;
}

.bottomNav{
position:fixed;
bottom:0;
left:0;
right:0;
height:70px;
background:#fff;
display:flex;
justify-content:space-around;
align-items:center;
box-shadow:0 -2px 10px rgba(0,0,0,.15);
}

.bottomNav button{
background:none;
border:none;
font-size:26px;
cursor:pointer;
}

</style>

</head>

<body>

<header>
Lammio 💙
</header>

<div id="content"></div>

<div class="bottomNav">

<button onclick="showPage('home')">🏠</button>

<button onclick="showPage('search')">🔍</button>

<button onclick="showPage('post')">➕</button>

<button onclick="showPage('messages')">💬</button>

<button onclick="showPage('profile')">👤</button>

</div>

<script>
  let content = document.getElementById("content");

let posts = [];

let userName = localStorage.getItem("userName") || "حسن";
let userBio = localStorage.getItem("userBio") || "مرحباً بك في Lammio";
let userImage = localStorage.getItem("userImage") || "";

showLogin();

function showLogin(){

content.innerHTML = `

<h2>تسجيل الدخول إلى Lammio</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button class="mainButton"
onclick="register(
document.getElementById('email').value,
document.getElementById('password').value
)">
إنشاء حساب
</button>

<button class="mainButton"
onclick="login(
document.getElementById('email').value,
document.getElementById('password').value
).then(user=>{
if(user){
showPage('home');
}
})">
تسجيل الدخول
</button>

`;

}

function showPage(page){

if(page=="home"){

content.innerHTML = `
<h2>🏠 الصفحة الرئيسية</h2>

<div id="postsContainer"></div>
`;

loadPosts();

}

if(page=="search"){

content.innerHTML = `
<h2>🔍 البحث</h2>

<input type="text" placeholder="ابحث عن مستخدم...">

`;

}

if(page=="post"){

content.innerHTML = `

<h2>➕ إنشاء منشور</h2>

<input id="title" placeholder="عنوان المنشور">

<textarea id="postText" placeholder="بماذا تفكر؟"></textarea>

<input type="file" id="postImage" accept="image/*">

<button class="mainButton" onclick="publishPost()">

نشر المنشور

</button>

`;

}

if(page=="messages"){

content.innerHTML = `

<h2>💬 الرسائل</h2>

<p>لا توجد رسائل حالياً.</p>

`;

}

if(page=="profile"){

content.innerHTML = `

<div class="post" style="text-align:center;">

<h2>👤 الملف الشخصي</h2>

<img
src="${userImage || 'https://via.placeholder.com/120'}"
style="width:120px;height:120px;border-radius:50%;margin:15px 0;">

<input type="file" id="newProfileImage" accept="image/*">

<h3>${userName}</h3>

<p>${userBio}</p>

<hr>

<button class="mainButton" onclick="editProfile()">

✏️ تعديل الملف الشخصي

</button>

</div>

`;

}

}
function publishPost() {

let title = document.getElementById("title").value;
let text = document.getElementById("postText").value;

if(title=="" || text==""){
alert("اكتب عنوانًا ونص المنشور");
return;
}

savePost(title,text);

}
function likePost(button){

let span=button.querySelector("span");

let count=Number(span.innerText);

if(button.dataset.liked=="true"){

count--;

button.dataset.liked="false";

button.innerHTML="👍 <span>"+count+"</span>";

}else{

count++;

button.dataset.liked="true";

button.innerHTML="❤️ <span>"+count+"</span>";

}

}

function showComment(button){

let comments=button.parentElement.nextElementSibling;

comments.innerHTML=`

<input id="commentText" placeholder="اكتب تعليقك...">

<button class="mainButton" onclick="addComment()">

إرسال

</button>

<div id="commentList"></div>

`;

}

function addComment(){

let text=document.getElementById("commentText").value;

if(text=="") return;

document.getElementById("commentList").innerHTML +=

"<p>👤 "+userName+": "+text+"</p>";

document.getElementById("commentText").value="";

}

function deletePost(button){

if(confirm("هل تريد حذف هذا المنشور؟")){

button.closest(".post").remove();

}

}

function editPost(button){

let post=button.closest(".post");

let title=post.querySelector("h4");

let text=post.querySelector("p");

let newTitle=prompt("عدل عنوان المنشور",title.textContent);

if(newTitle){
title.textContent=newTitle;
}

let newText=prompt("عدل نص المنشور",text.textContent);

if(newText){
text.textContent=newText;
}

}

function editProfile(){

let newName=prompt("اكتب اسمك",userName);

if(newName){

userName=newName;

localStorage.setItem("userName",userName);

}

let newBio=prompt("اكتب نبذة عنك",userBio);

if(newBio){

userBio=newBio;

localStorage.setItem("userBio",userBio);

}

showPage("profile");

}
window.showPage = showPage;

</script>

<script type="module" src="app.js"></script>

</body>
</html>
