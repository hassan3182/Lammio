<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lammio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --lammio-blue: #1877f2;
      --lammio-bg: #f0f2f5;
      --lammio-card: #ffffff;
      --lammio-border: #ced0d4;
      --lammio-text: #050505;
      --lammio-subtext: #65676b;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--lammio-bg);
      color: var(--lammio-text);
      padding-top: 90px;
      padding-bottom: 20px;
    }

    /* --- الهيدر العلوي لـ Lammio --- */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: white;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      z-index: 1000;
      border-bottom: 1px solid var(--lammio-border);
    }

    .top-bar .logo {
      color: var(--lammio-blue);
      font-size: 24px;
      font-weight: bold;
      letter-spacing: -0.5px;
    }

    .top-bar .header-icons {
      display: flex;
      gap: 8px;
    }

    .top-bar .header-icons button {
      background: #e4e6eb;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      color: var(--lammio-text);
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* --- شريط التبويبات التفاعلي --- */
    .nav-tabs {
      position: fixed;
      top: 48px;
      left: 0;
      right: 0;
      height: 42px;
      background: white;
      display: flex;
      border-bottom: 1px solid var(--lammio-border);
      z-index: 999;
    }

    .tab-btn {
      flex: 1;
      background: none;
      border: none;
      border-bottom: 3px solid transparent;
      font-size: 18px;
      color: var(--lammio-subtext);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .tab-btn.active {
      color: var(--lammio-blue);
      border-bottom-color: var(--lammio-blue);
    }

    /* --- الحاوية الرئيسية --- */
    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* --- صندوق "بم تفكر؟" --- */
    .create-post-box {
      background: var(--lammio-card);
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid var(--lammio-border);
      cursor: pointer;
    }

    .create-post-box img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .create-post-box input {
      flex: 1;
      border: 1px solid var(--lammio-border);
      border-radius: 20px;
      padding: 8px 14px;
      background: #f0f2f5;
      outline: none;
      font-size: 14px;
      cursor: pointer;
    }

    /* --- شريط القصص (Stories) --- */
    .stories-container {
      display: flex;
      gap: 8px;
      padding: 10px;
      background: white;
      overflow-x: auto;
      border-bottom: 1px solid var(--lammio-border);
      margin-bottom: 8px;
    }

    .story-card {
      min-width: 85px;
      height: 130px;
      border-radius: 10px;
      background: #e4e6eb;
      position: relative;
      flex-shrink: 0;
      overflow: hidden;
      border: 1px solid var(--lammio-border);
    }

    .story-card.add-story {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      background: #f7f8fa;
    }

    .story-card.add-story .plus-icon {
      width: 30px;
      height: 30px;
      background: var(--lammio-blue);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid white;
      margin-bottom: 25px;
    }

    .story-card.add-story span {
      position: absolute;
      bottom: 6px;
      font-size: 11px;
      font-weight: bold;
      color: var(--lammio-text);
    }

    /* --- كروت المنشورات --- */
    .post {
      background: var(--lammio-card);
      border-bottom: 8px solid var(--lammio-bg);
      padding: 12px;
    }

    /* --- شبكة القائمة (Menu Grid) --- */
    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 10px;
    }

    .menu-item {
      background: white;
      padding: 12px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
      border: 1px solid var(--lammio-border);
      cursor: pointer;
    }

    .menu-item i {
      font-size: 20px;
    }

    .menu-item span {
      font-size: 13px;
      font-weight: bold;
      color: var(--lammio-text);
    }

    .mainButton {
      width: 100%;
      background: var(--lammio-blue);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    input[type="text"], input[type="password"], textarea {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid var(--lammio-border);
      border-radius: 6px;
      outline: none;
    }
  </style>
</head>
<body>

  <!-- الهيدر العلوي لـ Lammio -->
  <div class="top-bar">
    <div class="logo">Lammio</div>
    <div class="header-icons">
      <button onclick="showPage('post')"><i class="fa-solid fa-plus"></i></button>
      <button onclick="showPage('search')"><i class="fa-solid fa-magnifying-glass"></i></button>
      <button onclick="showPage('menu')"><i class="fa-solid fa-bars"></i></button>
    </div>
  </div>

  <!-- شريط التبويبات الرئيسي -->
  <div class="nav-tabs">
    <button class="tab-btn active" id="tab-home" onclick="showPage('home')"><i class="fa-solid fa-house"></i></button>
    <button class="tab-btn" id="tab-friends" onclick="showPage('friends')"><i class="fa-solid fa-user-group"></i></button>
    <button class="tab-btn" id="tab-messages" onclick="showPage('messages')"><i class="fa-brands fa-facebook-messenger"></i></button>
    <button class="tab-btn" id="tab-notifications" onclick="showPage('notifications')"><i class="fa-solid fa-bell"></i></button>
    <button class="tab-btn" id="tab-menu" onclick="showPage('menu')"><i class="fa-solid fa-bars"></i></button>
  </div>

  <!-- المحتوى الرئيسي للمنصة -->
  <div class="container" id="appContent"></div>

  <script type="module" src="./app.js"></script>

  <script>
    function showPage(page) {
      const content = document.getElementById("appContent");

      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      const activeTab = document.getElementById(`tab-${page}`);
      if(activeTab) activeTab.classList.add('active');

      const userImage = localStorage.getItem("userImage") || "https://via.placeholder.com/40";
      const userName = localStorage.getItem("userName") || "مستخدم Lammio";

      if (page === "home") {
        content.innerHTML = `
          <div class="create-post-box" onclick="showPage('post')">
            <img src="${userImage}" />
            <input type="text" placeholder="بم تفكر في Lammio؟" readonly />
            <i class="fa-regular fa-image" style="color: #45bd62; font-size: 20px;"></i>
          </div>

          <!-- شريط القصص -->
          <div class="stories-container">
            <div class="story-card add-story">
              <div class="plus-icon"><i class="fa-solid fa-plus"></i></div>
              <span>إنشاء قصة</span>
            </div>
          </div>

          <!-- حاوية المنشورات الحقيقية القادمة من Firebase -->
          <div id="postsContainer"></div>
        `;
        if (window.loadPosts) window.loadPosts();
      } 
      else if (page === "messages") {
        content.innerHTML = `<div id="messagesPageContainer"></div>`;
        if (window.showMessages) window.showMessages();
      }
      else if (page === "search") {
        content.innerHTML = `<div id="searchPageContainer"></div>`;
        if (window.showSearch) window.showSearch();
      }
      else if (page === "menu") {
        content.innerHTML = `
          <div style="padding:10px;">
            <div style="background:white; padding:12px; border-radius:8px; display:flex; align-items:center; gap:10px; margin-bottom:10px; border:1px solid var(--lammio-border);">
              <img src="${userImage}" style="width:40px;height:40px;border-radius:50%;object-fit:cover;" />
              <div>
                <h3 style="font-size:15px;">${userName}</h3>
                <small style="color:var(--lammio-subtext);">الملف الشخصي</small>
              </div>
            </div>

            <!-- قائمة الخيارات والأدوات الخفيفة -->
            <div class="menu-grid">
              <div class="menu-item" onclick="showPage('messages')"><i class="fa-brands fa-facebook-messenger" style="color:#0084ff;"></i><span>الرسائل</span></div>
              <div class="menu-item" onclick="showPage('friends')"><i class="fa-solid fa-user-group" style="color:#1877f2;"></i><span>الأصدقاء</span></div>
              <div class="menu-item"><i class="fa-solid fa-sparkles" style="color:#a855f7;"></i><span>غرفة الأسرار</span></div>
              <div class="menu-item"><i class="fa-solid fa-bookmark" style="color:#a855f7;"></i><span>المحفوظات</span></div>
            </div>

            <button class="mainButton" style="background:#e4e6eb; color:black; margin-top:15px;" onclick="window.logout()">
              <i class="fa-solid fa-door-open"></i> تسجيل الخروج
            </button>
          </div>
        `;
      }
      else if (page === "post") {
        content.innerHTML = `
          <div class="post" style="margin:10px; border-radius:8px;">
            <h3 style="margin-bottom:10px;">إنشاء منشور جديد</h3>
            <input id="title" placeholder="عنوان المنشور">
            <textarea id="postText" rows="4" placeholder="بم تفكر؟"></textarea>
            
            <div style="background:#f0f2f5; padding:10px; border-radius:8px; margin:10px 0;">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
                <input type="checkbox" id="isSecret" onchange="document.getElementById('secretPassInput').style.display = this.checked ? 'block' : 'none'">
                <strong>🔒 منشور في غرفة الأسرار</strong>
              </label>
              <input type="password" id="secretPassInput" placeholder="كلمة السر للمنشور" style="display:none; margin-top:8px;">
            </div>

            <input type="file" id="postImage" accept="image/*">
            <button class="mainButton" onclick="publishPost()">نشر في Lammio</button>
          </div>
        `;
      }
    }

    function publishPost() {
      let title = document.getElementById("title").value;
      let text = document.getElementById("postText").value;
      let imageInput = document.getElementById("postImage");
      let isSecret = document.getElementById("isSecret") ? document.getElementById("isSecret").checked : false;
      let secretPass = document.getElementById("secretPassInput") ? document.getElementById("secretPassInput").value : "";

      if (!title || !text) {
        alert("يرجى كتابة عنوان ونص المنشور");
        return;
      }

      let save = () => {
        if (window.savePost) window.savePost(title, text, isSecret, secretPass);
      };

      if (imageInput && imageInput.files[0]) {
        let reader = new FileReader();
        reader.onload = function(e) {
          localStorage.setItem("tempPostImage", e.target.result);
          save();
        };
        reader.readAsDataURL(imageInput.files[0]);
      } else {
        localStorage.removeItem("tempPostImage");
        save();
      }
    }

    document.addEventListener("DOMContentLoaded", () => showPage("home"));
  </script>
</body>
</html>
