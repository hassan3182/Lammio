<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lammio</title>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Tahoma, sans-serif; }
body { background:#eef2ff; }
header { background:#4f46e5; color:#fff; padding:18px; text-align:center; font-size:28px; font-weight:bold; box-shadow:0 3px 8px rgba(0,0,0,.2); }
#content { padding:15px; padding-bottom:90px; }
.post { background:#fff; border-radius:15px; padding:15px; margin-bottom:15px; box-shadow:0 2px 8px rgba(0,0,0,.1); }
.post h3 { color:#4f46e5; margin-bottom:8px; }
.post h4 { margin-bottom:10px; }
.post p { line-height:1.7; margin-bottom:10px; }
.actions { display:flex; justify-content:space-around; margin-top:15px; }
.actions button { background:#eef2ff; border:none; padding:10px; border-radius:10px; cursor:pointer; font-size:16px; }
input, textarea { width:100%; padding:12px; margin:10px 0; border:1px solid #ccc; border-radius:10px; font-size:16px; }
.mainButton { width:100%; padding:14px; background:#4f46e5; color:white; border:none; border-radius:12px; font-size:18px; cursor:pointer; margin-top:8px; }
.bottomNav { position:fixed; bottom:0; left:0; right:0; height:70px; background:#fff; display:flex; justify-content:space-around; align-items:center; box-shadow:0 -2px 10px rgba(0,0,0,.15); }
.bottomNav button { background:none; border:none; font-size:26px; cursor:pointer; }
</style>
</head>

<body>

<header>Lammio 💙</header>

<div id="content"></div>

<div class="bottomNav">
  <button onclick="showPage('home')">🏠</button>
  <button onclick="showPage('search')">🔍</button>
  <button onclick="showPage('post')">➕</button>
  <button onclick="showPage('messages')">💬</button>
  <button onclick="showPage('profile')">👤</button>
</div>

<script>
  let content = document.getElementById("content");
  let userName = localStorage.getItem("userName") || "حسن";
  let userBio = localStorage.getItem("userBio") || "مرحباً بك في Lammio";
  let userImage = localStorage.getItem("userImage") || "";

  function showLogin(){
    window.currentUser = null;
    content.innerHTML = `
      <h2>تسجيل الدخول إلى Lammio</h2>
      <input id="email" type="email" placeholder="البريد الإلكتروني">
      <input id="password" type="password" placeholder="كلمة المرور">
      <button class="mainButton" onclick="handleRegister()">إنشاء حساب</button>
      <button class="mainButton" style="background:#3730a3;" onclick="handleLogin()">تسجيل الدخول</button>
    `;
  }

  function handleRegister() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('password').value;
    if (window.register) window.register(e, p);
  }

  function handleLogin() {
    const e = document.getElementById('email').value;
    const p = document.getElementById('password').value;
    if (window.login) window.login(e, p);
  }

  function publishPost() {
    let title = document.getElementById("title").value;
    let text = document.getElementById("postText").value;
    let imageInput = document.getElementById("postImage");

    if(title == "" || text == ""){
      alert("اكتب عنوانًا ونص المنشور");
      return;
    }

    if (imageInput && imageInput.files[0]) {
      let reader = new FileReader();
      reader.onload = function(e) {
        localStorage.setItem("tempPostImage", e.target.result);
        if(window.savePost) window.savePost(title, text);
      };
      reader.readAsDataURL(imageInput.files[0]);
    } else {
      localStorage.removeItem("tempPostImage");
      if(window.savePost) window.savePost(title, text);
    }
  }

  function showPage(page){
    if (!window.currentUser && sessionStorage.getItem("loggedIn") !== "true"){
        showLogin();
        return;
    }

    if(page == "home"){
        content.innerHTML = `<h2>🏠 الصفحة الرئيسية</h2><div id="postsContainer"></div>`;
        if(window.loadPosts) window.loadPosts();
    } else if(page == "search"){
        if(window.showSearch) window.showSearch();
    } else if(page == "post"){
        content.innerHTML = `
        <h2>➕ إنشاء منشور</h2>
        <input id="title" placeholder="عنوان المنشور">
        <textarea id="postText" placeholder="بماذا تفكر؟"></textarea>
        <label style="display:block; margin-top:10px; font-weight:bold;">إرفاق صورة:</label>
        <input type="file" id="postImage" accept="image/*" style="background:white;">
        <button class="mainButton" onclick="publishPost()">نشر المنشور</button>
        `;
    } else if(page == "messages"){
        if(window.showMessages) window.showMessages();
    } else if(page == "profile"){
        content.innerHTML = `
        <div class="post" style="text-align:center;">
        <h2>👤 الملف الشخصي</h2>
        <h3>${userName}</h3>
        <p>${userBio}</p>
        </div>`;
    }
  }

  window.showLogin = showLogin;
  window.showPage = showPage;
  window.handleRegister = handleRegister;
  window.handleLogin = handleLogin;
  window.publishPost = publishPost;

  showLogin();
</script>

<script type="module" src="app.js"></script>

</body>
</html>
